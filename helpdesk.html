<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img src="logo (1).png">
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday</p>
    <p>Check Blackboard for when CWA tutor will be there.</p>
    <form method="post" action="#">
        <fieldset>
            <legend>Student details</legend>
            <p><label for="Student ID"> Student ID</label>
                <input type="text" name= "studentid" id="studentid" maxlength="20" size="10" required="required" />
            </p>
            <p><label for="Given Name">Given Name</label>
                <input type="text" name="givenname" id="givenname" maxlength="30" size="10" required="required" />
                <label for="Family name">Family name</label>
                <input type="text" name="familyname" id="familyname" maxlength="30" size="10" required="required" />
            </p>
        </fieldset>
        <fieldset>
            <legend>Your unit</legend>
                <input type="radio" id="cos10011" name="unit"  value="number" required="required" />
                <label for="COS10011">COS1011</label>
                <input type="radio" id="cos60004" name="unit"  value="number" required="required" />
                <label for="COS60004">COS60004</label>
                <input type="radio" id="cos60007" name="unit"  value="number" required="required" />
                <label for="COS60007">COS60007</label>
                <p><label for="Your Tutor">Your Tutor</label>
                    <select name="tutor" id="tutor">
                        <option value="">Please Select</option>
                        <option value="Tom">Tom</option>
                        <option value="John">John</option>
                        <option value="Terry">Terry</option>
                        <option value="Alex">ALex</option>
                    </select>    
                </p>
                

        </fieldset>
        <fieldset>
            <legend>Issue</legend>
            <label for="HTML">HTML</label>
            <input type="checkbox" name="things[]"value="HTML" />
            <label for="CSS">CSS</label>
            <input type="checkbox" name="things[]"value="CSS" />
            <label for="JavaScript">JavaScript</label>
            <input type="checkbox" name="things[]"value="JavaScript" />
            <label for="PHP">PHP</label>
            <input type="checkbox" name="things[]"value="PHP" />
            <label for="MySQL">MySQL</label>
            <input type="checkbox" name="things[]"value="MySQl" />

            <p>Description of Issue</p>
            <p><label for="description"></label>
                <textarea
                 type="text" id="description" name="description" placeholder="Write description of your problem here..." rows=" 5" cols="40"  

                ></textarea>
                    
                
            </label></p>
            </fieldset>
            <fieldset>
                <legend>Preferred Date/Time</legend>
                <p><label>Date<input type="date" name="bday" /></label>
                </p>
                <p><label>Time</label>
                    <input type="text"name="time" id="time" placeholder="00:00" pattern="\d{2}:\d{2}" />
                </p>
            </fieldset>
            <input type="submit" value="Book">
            <input type="reset" value ="Reset form">
    </form>


    
</body>
</html>
